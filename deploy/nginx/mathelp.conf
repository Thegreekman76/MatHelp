# /etc/nginx/sites-available/mathelp.conf
#   sudo ln -s /opt/mathelp/repo/deploy/nginx/mathelp.conf /etc/nginx/sites-available/mathelp.conf
#   sudo ln -s /etc/nginx/sites-available/mathelp.conf   /etc/nginx/sites-enabled/mathelp.conf
#
# Sigue el patrón de citai.conf / syndesi.conf / fitzwatch.conf del VPS.
# Backend MatHelp (binario Fitz nativo, SSR liveviews) corre en docker-compose,
# bindeado a 127.0.0.1:8003 del host (loopback only, paralelo a citai=8000,
# syndesi=8001, fitzwatch=8002).
#
# MatHelp es SSR puro: el backend Fitz sirve TODO (HTML + WebSockets + estáticos
# vía static_dir="public"). No hay frontend estático separado, así que nginx
# solo hace de reverse-proxy — todo va a 127.0.0.1:8003.

# --- HTTPS server block ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mathelp.prothos.com.ar;

    # Cloudflare Origin certificate (generado en el dashboard de Cloudflare,
    # mismo modelo que citai/syndesi/fitzwatch).
    ssl_certificate     /opt/mathelp/ssl-certificates/mathelp.prothos.com.ar.pem;
    ssl_certificate_key /opt/mathelp/ssl-certificates/mathelp.prothos.com.ar.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_MATHELP:10m;
    ssl_session_timeout 1d;

    # Cloudflare real IP — reescribe $remote_addr a la IP real del cliente
    # (header CF-Connecting-IP). No hay rate-limit por IP en MatHelp hoy, pero
    # deja los logs y el X-Real-IP correctos por si aparece más adelante.
    # Rangos en https://www.cloudflare.com/ips-v4/ y /ips-v6/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # General
    client_max_body_size 2m;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml application/manifest+json;

    # Logging dedicado
    access_log /var/log/nginx/mathelp.access.log;
    error_log  /var/log/nginx/mathelp.error.log;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options "nosniff"                          always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;

    # --- WebSockets (juegos live: /live/quiz, /live/completa, ... 24 rutas) ---
    # Va PRIMERO para que matchee antes que el catch-all `location /`.
    location /live/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sin buffering los frames del cronómetro / diffs llegan en real-time.
        proxy_buffering off;
        proxy_read_timeout 7200s;   # 2hrs para conexiones de juego largas
    }

    # --- Health checks (Fitz auto-mount: /healthz + /readyz) ---
    location = /healthz {
        proxy_pass http://127.0.0.1:8003/healthz;
        proxy_set_header Host $host;
        access_log off;
    }
    location = /readyz {
        proxy_pass http://127.0.0.1:8003/readyz;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- OpenAPI + Scalar + AsyncAPI (Fitz auto-mount) ---
    location = /docs {
        proxy_pass http://127.0.0.1:8003/docs;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        proxy_pass http://127.0.0.1:8003/openapi.json;
        proxy_set_header Host $host;
        access_log off;
    }
    location = /asyncapi.json {
        proxy_pass http://127.0.0.1:8003/asyncapi.json;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Todo lo demás: HTML SSR + estáticos (public/) → backend Fitz ---
    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

# --- HTTP to HTTPS redirect ---
server {
    listen      80;
    listen [::]:80;
    server_name mathelp.prothos.com.ar;
    return 301 https://$server_name$request_uri;
}
