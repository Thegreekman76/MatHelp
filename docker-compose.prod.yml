# docker-compose.prod.yml — MatHelp en el VPS (app + Postgres).
#
# Difiere del docker-compose.yml (dev local) en tres cosas, siguiendo el
# patrón del VPS donde ya corren citai / syndesi / fitzwatch:
#
#   1. La app bindea 127.0.0.1:8003 (loopback only). Nginx del host hace
#      proxy_pass http://127.0.0.1:8003. Nadie llega directo al container.
#        citai=8000, syndesi=8001, fitzwatch=8002, mathelp=8003.
#   2. La DB NO se expone al host — solo accesible dentro de mathelp_network.
#   3. Red + volumen con nombre dedicado (mathelp_network / mathelp_pgdata)
#      para no chocar con las otras apps del VPS.
#
# Uso en el VPS:
#   cd /opt/mathelp/repo
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f app
#
# El .env vive en /opt/mathelp/repo/.env (NO se commitea). Ver deploy/README.md.

services:
  db:
    image: postgres:16-alpine
    container_name: mathelp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mathelp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mathelp}
    volumes:
      - mathelp_pgdata:/var/lib/postgresql/data
      # Los .sql corren solos la PRIMERA vez que se crea el volumen (orden por
      # nombre: 0001_init.sql, 0002..., etc). Para re-correrlos hay que borrar
      # el volumen: docker compose -f docker-compose.prod.yml down -v
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - mathelp_network
    # Sin `ports:` — la DB solo se ve desde mathelp_network.
    # Para debug puntual desde el host, agregar temporalmente:
    #   ports: ["127.0.0.1:5435:5432"]   # 5435 libre (citai=5433)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mathelp} -d ${POSTGRES_DB:-mathelp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mathelp-app
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-mathelp}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing in .env}@db:5432/${POSTGRES_DB:-mathelp}?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET missing in .env}
      MATHELP_DEFAULT_LOCALE: ${MATHELP_DEFAULT_LOCALE:-es-AR}
      MATHELP_PUBLIC_URL: ${MATHELP_PUBLIC_URL:-https://mathelp.prothos.com.ar}
      # Reporte semanal por email: APAGADO. Ojo: este VPS (DigitalOcean) bloquea
      # SMTP outbound (587/465). Para activarlo hay que refactorizar reporte.fitz
      # a un proveedor HTTP (Resend), igual que fitzwatch. No es blocker del launch.
      MATHELP_WEEKLY_REPORT: ${MATHELP_WEEKLY_REPORT:-0}
      # Disparo manual del reporte (endpoint de ops /__ops/run-weekly-report).
      # Apagado por default; se prende puntualmente para una corrida a demanda.
      MATHELP_MANUAL_REPORT: ${MATHELP_MANUAL_REPORT:-0}
      # Resend HTTP API — la vía real en prod (DigitalOcean bloquea SMTP).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
    ports:
      # Loopback only — nginx del host hace el proxy_pass.
      - "127.0.0.1:8003:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mathelp_network
    # Sin healthcheck a nivel container: el runtime es distroless/cc (sin shell,
    # sin wget/curl), así que no hay con qué pegarle a /healthz desde adentro.
    # El chequeo externo lo hace nginx (location /healthz) + Cloudflare.

networks:
  mathelp_network:
    name: mathelp_network
    driver: bridge

volumes:
  mathelp_pgdata:
    name: mathelp_pgdata
